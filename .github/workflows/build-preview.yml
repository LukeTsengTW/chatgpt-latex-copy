name: Build preview dependency bundle

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - src/preview-deps.js
      - .github/workflows/build-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build local preview dependency bundle
        run: npm run build:preview

      - name: Commit generated bundle when changed
        run: |
          git add vendor/preview-deps.js

          if git diff --cached --quiet; then
            echo "Preview bundle is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: update preview dependency bundle [skip ci]"
          git push
